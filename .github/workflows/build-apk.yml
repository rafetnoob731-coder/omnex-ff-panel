name: Build OMNEX FF Panel APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  VERSION_CODE: 1
  VERSION_NAME: 1.108.1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANDROID_HOME: $HOME/android-sdk
      ANDROID_SDK_ROOT: $ANDROID_HOME
      ANDROID_NDK_HOME: $ANDROID_HOME/ndk/25.2.9519653
      PATH: $HOME/android-sdk/cmdline-tools/latest/bin:$HOME/android-sdk/platform-tools:$HOME/android-sdk/ndk/25.2.9519653:$PATH

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tar unzip wget lib32stdc++6 lib32z1 libtinfo5 2>/dev/null || true
          
          mkdir -p $ANDROID_HOME/cmdline-tools/latest
          wget -q https://dl.google.com/android/repository/sdk-tools-linux-4333796.zip -O /tmp/sdk-tools.zip
          unzip -q /tmp/sdk-tools.zip -d $ANDROID_HOME/cmdline-tools/latest/
          rm /tmp/sdk-tools.zip
          
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653" "cmake;3.22.1" 2>&1 || true
          
          which sdkmanager && sdkmanager --version
          which adb && adb version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls $ANDROID_HOME/ndk/25.2.9519653/ || echo "NDK not found"

      - name: Create local.properties
        run: |
          echo "sdk.dir=$HOME/android-sdk" > local.properties
          echo "ndk.dir=$HOME/android-sdk/ndk/25.2.9519653" >> local.properties
          echo "cmake.dir=$HOME/android-sdk/cmake/3.22.1" >> local.properties
          cat local.properties

      - name: Make gradlew executable
        run: chmod +x gradlew && ls -la gradlew

      - name: Debug Build
        run: |
          echo "=== Environment ==="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "sdk.dir in local.properties:"
          cat local.properties
          echo "=== Gradle Build ==="
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build_output.log
          echo "=== Build Complete ==="
          echo "Finding APKs..."
          find . -name "*.apk" -not -path "*/test/*" 2>/dev/null || echo "No APKs found"
          ls -laR app/build/outputs/ 2>/dev/null || echo "No outputs dir"

      - name: Find APK
        id: apk
        run: |
          APK=$(find . -name "*.apk" -not -path "*/test/*" | head -1)
          echo "Found APK: $APK"
          if [ -z "$APK" ]; then
            echo "ERROR: No APK found!"
            find . -name "*.apk" 2>/dev/null || true
            ls -la app/build/outputs/ 2>/dev/null || true
            ls -laR app/build/outputs/apk/ 2>/dev/null || true
            exit 1
          fi
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "apk_name=$(basename $APK)" >> $GITHUB_OUTPUT
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: omnex-ff-panel-${{ github.run_number }}
          path: ${{ steps.apk.outputs.apk_path }}
          retention-days: 90

      - name: Build Summary
        if: always()
        run: |
          echo "======================================"
          echo "BUILD: ${{ github.run_number }}"
          echo "STATUS: ${{ job.status }}"
          echo "COMMIT: ${{ github.sha }}"
          echo "======================================"
          tail -30 build_output.log 2>/dev/null || true