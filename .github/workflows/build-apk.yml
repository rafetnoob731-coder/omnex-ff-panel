name: Build OMNEX FF Panel APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  APP_NAME: OmnexFFPanel
  VERSION_CODE: 1
  VERSION_NAME: 1.108.1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653" "cmake;3.22.1" 2>&1 || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Debug Build
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace 2>&1 | tee build_output.log
        env:
          GRADLE_OPTS: "-Xmx3072m -Dfile.encoding=UTF-8"
          ANDROID_SDK_ROOT: $ANDROID_HOME
          ANDROID_NDK_HOME: $ANDROID_HOME/ndk/25.2.9519653
          TERM: dumb

      - name: Find APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "apk_name=$(basename $APK)" >> $GITHUB_OUTPUT
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: omnex-ff-panel-${{ github.run_number }}
          path: ${{ steps.apk.outputs.apk_path }}
          retention-days: 90

      - name: Build Summary
        if: always()
        run: |
          echo "======================================"
          echo "BUILD: ${{ github.run_number }}"
          echo "STATUS: ${{ job.status }}"
          echo "COMMIT: ${{ github.sha }}"
          echo "======================================"
          tail -20 build_output.log 2>/dev/null || true