name: Build OMNEX FF Panel APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  VERSION_CODE: 1
  VERSION_NAME: 1.108.1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses and install tools
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653" "cmake;3.22.1" 2>&1 || true
          which sdkmanager
          which cmake
          ls $ANDROID_HOME/ndk/

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x gradlew && ls -la gradlew

      - name: Debug Build
        run: |
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_NDK_HOME:$PATH
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build_output.log
          echo "---BUILD DONE---"
          find . -name "*.apk" 2>/dev/null || echo "No APK found by find"
          ls -la app/build/outputs/apk/ 2>/dev/null || echo "No outputs dir"
          ls -laR app/build/outputs/ 2>/dev/null || echo "No outputs at all"

      - name: Find APK
        id: apk
        run: |
          APK=$(find . -name "*.apk" -not -path "*/test/*" | head -1)
          echo "Found APK: $APK"
          if [ -z "$APK" ]; then
            echo "ERROR: No APK found"
            find . -name "*.apk" || echo "No APKs anywhere"
            exit 1
          fi
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "apk_name=$(basename $APK)" >> $GITHUB_OUTPUT
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: omnex-ff-panel-${{ github.run_number }}
          path: ${{ steps.apk.outputs.apk_path }}
          retention-days: 90

      - name: Build Summary
        if: always()
        run: |
          echo "======================================"
          echo "BUILD: ${{ github.run_number }}"
          echo "STATUS: ${{ job.status }}"
          echo "COMMIT: ${{ github.sha }}"
          echo "======================================"
          tail -30 build_output.log 2>/dev/null || true